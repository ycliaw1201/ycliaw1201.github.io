<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神經內科平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            scroll-behavior: smooth;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .bg-gradient-mesh {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(210,100%,93%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,100%,93%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(210,100%,93%,1) 0, transparent 50%);
        }
    </style>
</head>
<body class="bg-gradient-mesh min-h-screen text-slate-800">

    <nav class="sticky top-0 z-50 w-full px-6 py-4 glass-card border-b bg-white/50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 p-2 rounded-lg">
                    <i data-lucide="microscope" class="text-white w-5 h-5"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-900 uppercase">Research Hub</span>
            </div>
            <div class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="#projects" class="hover:text-indigo-600 transition-colors">專案列表</a>
                <a href="#" class="hover:text-indigo-600 transition-colors">關於我</a>
                <a href="#" class="px-4 py-2 bg-slate-900 text-white rounded-full hover:bg-slate-800 transition-all">聯絡資訊</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 pt-20 pb-32">
        <header class="text-center mb-24">
            <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 mb-6 tracking-tight">
                學術研究與數位工具
            </h1>
            <p class="text-lg md:text-xl text-slate-600 max-w-2xl mx-auto leading-relaxed">
                神經科學研究專案與開發工具。
            </p>
        </header>

        <section id="projects" class="grid md:grid-cols-2 gap-8">
            
            <!-- Research Digest Card -->
            <div class="glass-card rounded-3xl p-8 flex flex-col h-full">
                <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mb-6">
                    <i data-lucide="book-open"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900 mb-4">Research Digest</h2>
                <p class="text-slate-600 mb-8 flex-grow leading-relaxed">
                    研究文獻摘要平台，分析與結構化的內容呈現。
                </p>
                <a href="https://ycliaw1201.github.io/research-digest/" 
                   target="_blank"
                   class="inline-flex items-center justify-center w-full py-4 px-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-2xl transition-all group">
                    進入專案
                    <i data-lucide="external-link" class="ml-2 w-4 h-4 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                </a>
            </div>

            <!-- NeuroApp Card -->
            <div class="glass-card rounded-3xl p-8 flex flex-col h-full">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mb-6">
                    <i data-lucide="brain-circuit"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900 mb-4">NeuroApp</h2>
                <p class="text-slate-600 mb-8 flex-grow leading-relaxed">
                    專為神經科門診與診斷設計的應用程式。
                </p>
                <a href="https://ycliaw1201.github.io/neuroapp/" 
                   target="_blank"
                   class="inline-flex items-center justify-center w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl transition-all group">
                    進入專案
                    <i data-lucide="external-link" class="ml-2 w-4 h-4 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                </a>
            </div>

        </section>

        <footer class="mt-32 pt-12 border-t border-slate-200 text-center">
            <p class="text-slate-500 text-sm">
                &copy; 2024 YC Liaw Research Group. All rights reserved.
            </p>
            <div class="flex justify-center space-x-6 mt-6">
                <a href="#" class="text-slate-400 hover:text-slate-600"><i data-lucide="github" class="w-5 h-5"></i></a>
                <a href="#" class="text-slate-400 hover:text-slate-600"><i data-lucide="mail" class="w-5 h-5"></i></a>
                <a href="#" class="text-slate-400 hover:text-slate-600"><i data-lucide="linkedin" class="w-5 h-5"></i></a>
            </div>
        </footer>
    </main>

    <script>
        // 初始化 Lucide 圖標
        lucide.createIcons();

        // 簡單的進入動畫效果
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.glass-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 200 * index);
            });
        });
    </script>
</body>
</html>
